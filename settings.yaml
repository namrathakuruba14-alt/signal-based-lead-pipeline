# ============================================================
# SETTINGS FILE - the only file you edit to target a new market
# ============================================================
# The code reads everything below. To point the pipeline at a
# different market, change the values here. Do not change the code.
#
# Lines starting with # are notes for humans. The code ignores them.

# ---------- 1. WHO are we looking for? ----------
market:
  name: "US food manufacturers"
  description: "Companies that make food products in the United States"
  country: "US"
  employees_min: 11
  employees_max: 200
  # How many companies we want in the final list
  goal_company_count: 50

# ---------- 1b. WHERE does the starting list come from? ----------
# Step 1 pulls companies from this source.
#
# "type" picks WHICH source plug-in to use. Each plug-in is one file in
# the sources/ folder. To use a different source for a new market
# (e.g. a job board for startups), add a plug-in file there and put its
# name here. The rest of the pipeline stays the same.
#
# Everything under "type" is settings for that particular plug-in.
source:
  type: "openfda_recalls"
  # openFDA = the US Food and Drug Administration's free public database.
  # No password or key needed.
  name: "FDA food recalls (openFDA)"
  url: "https://api.fda.gov/food/enforcement.json"
  # How far back to look. 365 = recalls reported in the last 12 months.
  lookback_days: 365
  # Safety cap so we never download more than we need
  max_records: 3000

# ---------- 1c. HOW do we spot the same company listed twice? ----------
# Step 2 treats two rows as the same company when their names match
# after ignoring capitals, punctuation and the endings below.
# Example: "Honeyville, Inc" and "HONEYVILLE INC." are the same company.
# For another country, add its endings here (e.g. "gmbh", "plc", "pty").
clean:
  name_endings_to_ignore:
    - "inc"
    - "incorporated"
    - "llc"
    - "lp"
    - "llp"
    - "ltd"
    - "limited"
    - "co"
    - "company"
    - "corp"
    - "corporation"
  # Also require this column to match, so two different companies that
  # share a name are not merged. Use "" to match on name only.
  must_also_match: "state"

# ---------- 1d. HOW do we find each company's website? ----------
# Step 3a guesses web addresses from the company name
# (e.g. "Honeyville, Inc" -> honeyville.com) and then CHECKS each guess.
# A guess is only accepted if the site itself shows the company's name
# plus its city/state or zip code. Otherwise: "not found".
find_website:
  # How many companies to process per run (newest signal first)
  # Companies already checked in an earlier run are skipped, not re-visited.
  companies_per_run: 500
  # Address endings to try
  domain_endings:
    - ".com"
  # Generic words at the end of a name that companies often leave out of
  # their web address ("Palmetto Gourmet Foods" -> palmettogourmet.com).
  # We try the address with and without them.
  optional_last_words:
    - "foods"
    - "food"
    - "products"
    - "brands"
    - "group"
    - "enterprises"
    - "international"
    - "usa"
    - "holdings"
  # Besides the home page, look at up to this many other pages:
  # contact, locations, about, then privacy and terms (which often carry
  # the legal address)
  extra_pages_per_site: 4

# ---------- 1e. WHICH pages do we save from each website? ----------
# Step 3b saves the text of the home page plus ONE page of each kind
# below, if the site has it. A page is recognised by these words in its
# link. Later steps read the saved copies, so each site is visited once.
collect_pages:
  page_kinds:
    about:
      - "about"
      - "our story"
      - "our-story"
      - "who we are"
      - "who-we-are"
    products:
      - "product"
      - "what we make"
      - "what-we-make"
      - "what we do"
      - "what-we-do"
      - "shop"
    careers:
      - "career"
      - "jobs"
      - "join our team"
      - "join-our-team"
      - "employment"
      - "work with us"
      - "work-with-us"
    news:
      - "news"
      - "press"
      - "blog"

# ---------- 1f. WHICH food safety words do we look for? ----------
# Step 3b records every one of these found on a company's saved pages,
# with the sentence it appeared in. Plain word matching, no judgement.
# For another market, replace this list with that market's terms.
food_safety_terms:
  - "SQF"
  - "BRC"
  - "BRCGS"
  - "FSSC 22000"
  - "ISO 22000"
  - "GFSI"
  - "HACCP"
  - "GMP"
  - "cGMP"
  - "FSMA"
  - "USDA Organic"
  - "Certified Organic"
  - "Non-GMO Project"
  - "Kosher"
  - "Halal"
  - "Gluten-Free Certified"
  - "third-party audit"
  - "third party audit"
  - "food safety"
  - "allergen"
  - "lab tested"
  - "lab testing"

# ---------- 1g. HOW do we look for signals on the saved pages? ----------
# Step 4 first pulls out every line on a company's saved pages that
# contains one of the names or phrases below ("candidate lines").
# A reader then decides whether each one is a real signal.
# For another market, replace these lists.
signal_search:
  # A signal counts as STRONG if it is dated within this many days of
  # the day Step 4 is run, WEAK if it has no date, and is left blank if
  # the pages do not mention it.
  strong_if_dated_within_days: 365

  # Big US retailers. These usually require suppliers to hold a food
  # safety certification, which is why selling to them is a signal.
  big_retailers:
    - "Walmart"
    - "Sam's Club"
    - "Costco"
    - "Target"
    - "Kroger"
    - "Whole Foods"
    - "Albertsons"
    - "Safeway"
    - "Publix"
    - "H-E-B"
    - "Trader Joe's"
    - "Aldi"
    - "Meijer"
    - "Wegmans"
    - "Sprouts"
    - "BJ's"
    - "Hy-Vee"
    - "Food Lion"
    - "Stop & Shop"
    - "ShopRite"
    - "Dollar General"
    - "CVS"
    - "Walgreens"
  retailer_phrases:
    - "available at"
    - "available in stores"
    - "find us at"
    - "find us in"
    - "now at"
    - "sold at"
    - "sold in"
    - "in stores"
    - "retailers"
    - "where to buy"
  export_phrases:
    - "export"
    - "international"
    - "countries"
    - "worldwide"
    - "overseas"
    - "globally"
    - "around the globe"
  new_product_phrases:
    - "new product"
    - "launch"
    - "introducing"
    - "now available"
    - "new flavor"
    - "new line"
    - "announces"
    - "limited edition"
    - "coming soon"
    - "just in"

# ---------- 2. WHAT do we offer them? ----------
# Used by the "Judge" step to decide fit / maybe / no.
offer:
  summary: "Food safety services: food testing, audits and certifications"
  a_good_fit_is: >
    A company that makes food itself (not just a restaurant, retailer or
    distributor) and is likely to need outside help with food testing,
    audits or certifications.
  # Questions the Judge step must answer "yes" to, with evidence, before
  # a company can be a "fit". The source list includes retailers and
  # restaurants (e.g. grocery chains), so this check matters.
  must_be_true:
    - "The company manufactures or processes food itself"
  # How company size is treated when judging fit:
  #  - A STATED size outside employees_min..employees_max rules a company out.
  #  - An UNKNOWN size never rules a company out. Most small companies do
  #    not publish their headcount, so "unknown" is normal, not a red flag.
  #  - Example: size unknown + manufactures itself + has a recall = "maybe".
  unknown_size_rules_out: false
  # What counts as "size unknown"? A founding year ("since 1947") was
  # collected as a size clue, but it says nothing about how big a company
  # is today.
  #   true  = a founding year alone is enough for size to count as known
  #   false = size is known only if there is an employee count, a plant
  #           count or a facility size
  founding_year_alone_counts_as_size: false

  # Which companies go forward to Step 6 (decision maker finder) and
  # into the final CSV:
  #   - every "fit"
  #   - every "maybe" whose ONLY reason is that size is unknown.
  #     In the final CSV these carry the label below.
  # "Maybe" companies that are likely too big, or whose website does not
  # say who makes the product, do not go forward.
  size_unknown_label: "maybe: confirm headcount before outreach"

# ---------- 2a. Step 6: decision maker finder ----------
decision_maker:
  # Step 6 runs on:
  #   - every "fit"
  #   - "size unknown" maybes that also match the top-priority rule
  #     (big retailer or export, and no audited certification found)
  # minus any company listed here. These were removed by a person because
  # they are known to be very large, even though their saved pages never
  # state a headcount.
  dropped_by_hand:
    - "postconsumerbrands.com"
    - "griffithfoods.com"
    - "greatlakescheese.com"

  # Who we want, most wanted first. The first kind found is the contact.
  # Each kind lists words that identify it in a job title.
  # An owner or founder is a valid contact at a small company.
  role_order:
    - kind: "QA / food safety"
      title_words: ["quality", "food safety", "QA", "QC", "compliance", "regulatory"]
    - kind: "operations"
      title_words: ["operations", "COO", "plant manager", "production manager", "general manager"]
    - kind: "owner / founder"
      title_words: ["owner", "founder", "co-founder", "president", "CEO", "proprietor", "chief executive"]

  # Besides the pages already saved, look for ONE page of this kind,
  # only if the website links to it and it is not saved yet.
  team_page_words:
    - "team"
    - "leadership"
    - "our people"
    - "our-people"
    - "management"
    - "staff"
    - "meet"

  # "Likely too big" flag. Some companies never state a headcount but
  # give other clues that they are well over the size limit. Such a
  # company is NOT excluded. It is only marked so a person can review it.
  likely_too_big_flag:
    plants_at_least: 2             # two or more plants/factories
    facility_sq_ft_at_least: 100000  # one very large facility
    excludes_company: false

# ---------- 2b. Word lists used by the Judge step (Step 5) ----------
# Step 5 is plain rules in code. These lists are the only "knowledge"
# it has about what counts as a food maker in this market.
judge:
  # If any of these appears in what the company makes (the label or the
  # quote behind it), the company is "not a food maker" -> No.
  not_food_maker_keywords:
    - "supplement"
    - "vitamin"
    - "probiotic"
    - "nutraceutical"
    - "herbal"
    - "garden seeds"
    - "packaging, not food"
  # If any of these appears, the product is no longer made -> No.
  discontinued_keywords:
    - "discontinued"

# ---------- 3. WHICH signals show they might need it now? ----------
# A signal = a recent, public event that suggests a need.
# "points" is how much each signal adds to the company's score.
# Change the points to change what the pipeline treats as most important.
signals:
  - id: hiring_qa
    label: "Hiring QA or food safety roles"
    look_for: "Job postings for quality assurance, food safety, HACCP, SQF or compliance roles"
    # Low weight on purpose. Most careers pages just link to an outside
    # job board, which this pipeline does not visit. So "no QA job found"
    # usually means "we could not see the job list", not "they are not
    # hiring". A signal we can rarely see should not move the score much.
    points: 1

  - id: recall
    label: "Recent recall"
    look_for: "A product recall published by the FDA or USDA"
    points: 3

  - id: retail_expansion
    label: "Trying to get into big retailers"
    look_for: "News or website mentions of launching in large retailers (e.g. Walmart, Costco, Whole Foods) that require certification"
    points: 3

  - id: export
    label: "Starting to export"
    look_for: "News or website mentions of selling to new countries or international expansion"
    points: 2

  - id: new_product
    label: "New product launch"
    look_for: "News or website mentions of a new product or product line"
    points: 1

# ---------- 3b. Named scoring rules ----------
# A named rule is a combination of facts that matters more than the
# points alone. Used in the scoring step (Step 7).
#
# Scoring must NOT depend on a signal being "strong". Step 4 showed that
# websites almost never date these statements, so nearly every signal is
# "weak". A weak signal counts in full for the rule below.
scoring_rules:
  top_priority:
    description: >
      Had a recall, AND sells to a big retailer or exports, AND no food
      safety certification was found on its website. This company has a
      proven problem, has customers who demand certification, and shows
      no sign of holding one. That is exactly the gap our client fills.
    requires_all:
      - "recall"
      - "big retailer OR export"
      - "no certification term found"
    # Which terms count as a food safety CERTIFICATION for this rule.
    # (Kosher, Organic, HACCP and GMP are not counted: they are diet
    # labels or internal programmes, not the audited schemes that big
    # retailers ask for.)
    certification_terms:
      - "SQF"
      - "BRC"
      - "BRCGS"
      - "FSSC 22000"
      - "ISO 22000"
      - "GFSI"

# ---------- 4. WHO would we contact there? ----------
# Job titles only. The pipeline does not collect names from LinkedIn.
contact_roles:
  - "QA manager / food safety manager"
  - "Head of operations"
  - "Owner / founder"

# ---------- 5. Good manners and safety ----------
politeness:
  # Wait this many seconds between visits to the same website
  seconds_between_requests: 5
  # Give up on a slow website after this many seconds
  timeout_seconds: 20
  # Never visit these sites
  blocked_sites:
    - "linkedin.com"

# ---------- 6. Rules for missing information ----------
# We never guess. If a fact can't be found, we write this instead.
missing_value_text: "not found"

# ---------- 7. Where files are saved ----------
output:
  # Real results (kept OFF GitHub - see .gitignore)
  data_folder: "data"
  # Fake-name example that IS safe for GitHub
  sample_folder: "sample_output"
